<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Gather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">Gather<span>.</span></a>
      <nav class="site-nav"></nav>
    </div>
  </header>

  <main class="dash">
    <div class="wrap">
      <p class="eyebrow">Everything, everywhere</p>
      <h1 style="margin-top:8px">Admin</h1>

      <div id="stats" style="display:flex;gap:16px;margin-top:28px;flex-wrap:wrap"></div>

      <section class="dash-section">
        <h2>Users</h2>
        <table class="table">
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </section>

      <section class="dash-section">
        <h2>All events</h2>
        <table class="table">
          <thead>
            <tr>
              <th>Event</th><th>Host</th><th>Date</th><th>Registered</th><th></th>
            </tr>
          </thead>
          <tbody id="admin-events-body"></tbody>
        </table>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">Gather &mdash; admin panel.</div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
