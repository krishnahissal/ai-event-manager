<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Dashboard — Gather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">Gather<span>.</span></a>
      <nav class="site-nav">
        <a href="index.html">Browse</a>
        <a href="create-event.html">Host an event</a>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="login.html">Log in</a>
        <a class="btn" href="register.html">Sign up</a>
      </nav>
    </div>
  </header>

  <main class="dash">
    <div class="wrap">
      <p class="eyebrow">Your account</p>
      <h1 style="margin-top:8px">Your dashboard</h1>

      <section class="dash-section">
        <h2>Events you joined</h2>
        <table class="table">
          <thead>
            <tr>
              <th>Event</th>
              <th>When</th>
              <th>Ticket</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tickets-body"></tbody>
        </table>
      </section>

      <section class="dash-section">
        <h2>Events you host</h2>
        <table class="table">
          <thead>
            <tr>
              <th>Event</th>
              <th>Date</th>
              <th>Registered</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="hosted-body"></tbody>
        </table>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      Gather &mdash; community events in Pune.
    </div>
  </footer>

  
  <script src="JS/main.js"></script>
  <script src="JS/dashboard.js"></script>
</body>
</html>
