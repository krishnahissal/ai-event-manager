<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Log in — Gather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">Gather<span>.</span></a>
      <nav class="site-nav">
        <a href="index.html">Browse</a>
        <a href="create-event.html">Host an event</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="login.html" class="active">Log in</a>
        <a class="btn" href="register.html">Sign up</a>
      </nav>
    </div>
  </header>

  <main class="form-page">
    <div class="wrap">
      <form class="form-card" id="auth-form" data-mode="login">
        <p class="eyebrow">Welcome back</p>
        <h1>Log in</h1>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <div style="margin-top:26px">
          <button type="submit" class="btn btn-block">Log in</button>
        </div>

        <div class="notice hidden" id="auth-notice"></div>

        <p class="form-foot">No account? <a href="register.html">Sign up</a></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      Gather &mdash; community events in Pune.
    </div>
  </footer>
  <script src="JS/main.js"></script>
  <script src="JS/auth.js"></script>
</body>
</html>
