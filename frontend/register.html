<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Gather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">Gather<span>.</span></a>
      <nav class="site-nav">
        <a href="index.html">Browse</a>
        <a href="create-event.html">Host an event</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="login.html">Log in</a>
        <a class="btn" href="register.html">Sign up</a>
      </nav>
    </div>
  </header>

  <main class="form-page">
    <div class="wrap">
      <form class="form-card" id="auth-form" data-mode="register">
        <p class="eyebrow">Free to join</p>
        <h1>Create an account</h1>
        <p class="muted">One account lets you join events and host your own.</p>

        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required
                 minlength="8" autocomplete="new-password">
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" required
                 minlength="8" autocomplete="new-password">
        </div>

        <div style="margin-top:26px">
          <button type="submit" class="btn btn-block">Create account</button>
        </div>

        <div class="notice hidden" id="auth-notice"></div>

        <p class="form-foot">Already have one? <a href="login.html">Log in</a></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      Gather &mdash; a practice project. Nothing here is saved yet.
    </div>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
